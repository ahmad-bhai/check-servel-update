<!DOCTYPE html>
<html>
<head>
<title>ADMIN PANEL SYSTEM</title>

<style>
body{
font-family:sans-serif;
text-align:center;
padding:40px;
}

textarea{
width:90%;
height:200px;
}

button{
padding:10px 30px;
font-size:18px;
margin-top:20px;
}

#msg{
margin-top:20px;
font-weight:bold;
}
</style>

</head>

<body>

<h1>ADMIN PANEL SYSTEM</h1>

<h3>SERVER SYSTEM SCRIPT</h3>

<textarea id="code"></textarea>

<br>

<button onclick="update()">GET UPDATE</button>

<div id="msg"></div>

<script>

function isJS(code){

try{

new Function(code);

return true;

}catch{

return false;

}

}

function update(){

let code=document.getElementById("code").value
let msg=document.getElementById("msg")

if(!isJS(code)){

msg.innerHTML="Hello Ahmad Bhai please enter only Js (JavaScript) code"
msg.style.color="red"

document.getElementById("code").value=""

return

}

fetch("https://script-update-server-default-rtdb.firebaseio.com/users.json",{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(code)

})

.then(()=>{

msg.innerHTML="Script updated done"
msg.style.color="green"

document.getElementById("code").value=""

})

}

</script>

</body>
</html>
