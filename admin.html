<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin JS Update</title>
<style>
body { font-family:sans-serif; padding:20px; background:#222; color:#fff; }
textarea { width:100%; height:300px; font-family:monospace; padding:10px; }
button { padding:10px 20px; margin-top:10px; background:green; color:white; border:none; cursor:pointer; }
#status { margin-top:10px; font-weight:bold; }
.success { color:green; }
.error { color:red; }
</style>
</head>
<body>

<h2>SCRIPT UPDATE SYSTEM</h2>

<textarea id="code" placeholder="Paste JS code here"></textarea><br>
<button onclick="update()">GET UPDATE</button>

<div id="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-database.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-analytics.js";

// ===== Your Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyDuoka8B7oR6blqM6DawxGR7Lz1q6g6n44",
  authDomain: "script-update-server.firebaseapp.com",
  projectId: "script-update-server",
  storageBucket: "script-update-server.firebasestorage.app",
  messagingSenderId: "1065485832455",
  appId: "1:1065485832455:web:7705978342f83a9caf35a2",
  measurementId: "G-RW1VCSL93V"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getDatabase(app);

function update() {
    const code = document.getElementById("code").value.trim();
    const status = document.getElementById("status");

    // Basic JS validation
    const jsKeywords = ["function","let","const","var","=>","document","console","window"];
    const isJS = jsKeywords.some(k => code.includes(k));

    if (!isJS) {
        status.innerText = "Sorry Ahmad Bhai, just type only Js (JavaScript) code Thank you.";
        status.className = "error";
        return;
    }

    set(ref(db, 'latestJS'), code)
        .then(() => {
            status.innerText = "Your script updated done";
            status.className = "success";
        })
        .catch((e) => {
            status.innerText = "Update failed!";
            status.className = "error";
            console.error(e);
        });
}
</script>

</body>
</html>
