<!DOCTYPE html>
<html>
<head>
<title>ADMIN PANEL SYSTEM</title>
<style>
body{
font-family:sans-serif;
text-align:center;
padding:40px;
background:#f5f5f5;
}

textarea{
width:90%;
height:200px;
padding:10px;
font-size:15px;
}

button{
margin-top:20px;
padding:10px 30px;
font-size:18px;
cursor:pointer;
}

#msg{
margin-top:20px;
font-size:18px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>ADMIN PANEL SYSTEM</h1>

<h3>SERVER SYSTEM SCRIPT</h3>

<textarea id="scriptInput" placeholder="Paste JavaScript here"></textarea>

<br>

<button onclick="updateScript()">GET UPDATE</button>

<div id="msg"></div>

<script>

function isValidJS(code){
try{
new Function(code);
return true;
}catch(e){
return false;
}
}

function updateScript(){

let code=document.getElementById("scriptInput").value;
let msg=document.getElementById("msg");

if(!isValidJS(code)){

msg.innerHTML="Hello Ahmad Bhai please enter only Js (JavaScript) code";
msg.style.color="red";

document.getElementById("scriptInput").value="";

return;
}

fetch("script.json",{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({script:code})
})

.then(()=>{

msg.innerHTML="Script updated done";
msg.style.color="green";

document.getElementById("scriptInput").value="";

})

}

</script>

</body>
</html>
