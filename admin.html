<!DOCTYPE html>
<html>
<head>

<title>ADMIN PANEL SYSTEM</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

body{
font-family:sans-serif;
text-align:center;
padding:40px;
}

textarea{
width:90%;
height:200px;
}

button{
padding:10px 30px;
font-size:18px;
margin-top:20px;
}

#msg{
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>ADMIN PANEL SYSTEM</h1>

<h3>SERVER SYSTEM SCRIPT</h3>

<textarea id="code"></textarea>

<br>

<button onclick="updateScript()">GET UPDATE</button>

<div id="msg"></div>

<script>

var firebaseConfig = {
apiKey: "AIzaSyDuoka8B7oR6blqM6DawxGR7Lz1q6g6n44",
authDomain: "script-update-server.firebaseapp.com",
databaseURL: "https://script-update-server-default-rtdb.firebaseio.com",
projectId: "script-update-server",
storageBucket: "script-update-server.firebasestorage.app",
messagingSenderId: "1065485832455",
appId: "1:1065485832455:web:7705978342f83a9caf35a2"
};

firebase.initializeApp(firebaseConfig);

var db = firebase.database();

function isJS(code){
try{
new Function(code);
return true;
}catch{
return false;
}
}

function updateScript(){

var code = document.getElementById("code").value;
var msg = document.getElementById("msg");

if(!isJS(code)){

msg.innerHTML="Hello Ahmad Bhai please enter only Js (JavaScript) code";
msg.style.color="red";

document.getElementById("code").value="";

return;
}

db.ref("script").set(code);

msg.innerHTML="Script updated done";
msg.style.color="green";

document.getElementById("code").value="";

}

</script>

</body>
</html>
