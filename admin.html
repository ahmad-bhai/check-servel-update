<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ahmad Bhai - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c242a; color: white; text-align: center; padding: 20px; }
        textarea { width: 90%; height: 400px; background: #000; color: #00ff00; padding: 15px; border: 1px solid #333; font-family: monospace; border-radius: 8px; }
        button { background: #05c55e; color: white; padding: 15px 40px; border: none; cursor: pointer; margin-top: 15px; font-weight: bold; border-radius: 5px; font-size: 16px; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>ADMIN PANEL</h2>
    <textarea id="scriptInput" placeholder="Paste JS Code here..."></textarea><br>
    <button id="updateBtn">GET UPDATE</button>
    <div id="status"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuoka8B7oR6blqM6DawxGR7Lz1q6g6n44",
            databaseURL: "https://script-update-server-default-rtdb.firebaseio.com",
            projectId: "script-update-server",
            appId: "1:1065485832455:web:7705978342f83a9caf35a2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('updateBtn').addEventListener('click', () => {
            const code = document.getElementById('scriptInput').value.trim();
            const status = document.getElementById('status');

            if (code.toLowerCase().startsWith("<!doctype") || code.toLowerCase().startsWith("<html")) {
                status.style.color = "#ff6251";
                status.innerHTML = "Hello Ahmad Bhai please enter only Js (JavaScript) code";
                document.getElementById('scriptInput').value = "";
                return;
            }

            db.ref("server_config").set({
                js_content: code,
                last_updated: Date.now()
            }).then(() => {
                status.style.color = "#05c55e";
                status.innerHTML = "Script updated done";
            });
        });
    </script>
</body>
</html>
