<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRIPT UPDATE SYSTEM</title>
<style>
body { font-family: sans-serif; padding: 20px; background:#222; color:#fff; }
h2 { margin-bottom: 10px; }
textarea { width:100%; height:250px; padding:10px; font-family: monospace; }
button { padding:10px 20px; margin-top:10px; background:green; color:white; border:none; cursor:pointer; }
#status { margin-top:10px; font-weight:bold; }
.success { color:green; }
.error { color:red; }
input { padding:5px; width:200px; margin-bottom:10px; }
</style>
</head>
<body>

<h2>Admin: SCRIPT UPDATE SYSTEM</h2>

<label for="user">User Name:</label><br>
<input id="user" type="text" placeholder="Your name"><br>

<textarea id="code" placeholder="Paste JS code here"></textarea><br>
<button onclick="update()">GET UPDATE</button>

<div id="status"></div>

<script>
async function update() {
    const code = document.getElementById("code").value.trim();
    const status = document.getElementById("status");

    // simple JS validation
    const jsKeywords = ["function","let","const","var","=>","console","document","window"];
    const isJS = jsKeywords.some(k => code.includes(k));

    if (!isJS) {
        status.innerText = "Sorry Ahmad Bhai, just type only Js (JavaScript) code Thank you.";
        status.className = "error";
        return;
    }

    try {
        await fetch("/script.js", {
            method: "PUT",
            headers: { "Content-Type": "text/plain" },
            body: code
        });

        status.innerText = "Your script updated done";
        status.className = "success";
    } catch (e) {
        status.innerText = "Update failed!";
        status.className = "error";
    }
}
</script>

</body>
</html>
